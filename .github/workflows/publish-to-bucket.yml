# Builds the biopentra-storefront package and uploads it to the private update
# server on every storefront release tag.
#
# Repo secrets: WPUS_URL (<server>/push.php), WPUS_TOKEN (bearer token).
# Repo variable: PLUGIN_SLUG = biopentra-storefront

name: Publish release package

on:
  push:
    tags: ['storefront-v*']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Resolve slug and version
        id: meta
        run: |
          slug="${{ vars.PLUGIN_SLUG }}"
          [ -n "$slug" ] || slug="biopentra-storefront"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#storefront-v}" >> "$GITHUB_OUTPUT"

      - name: Build package
        id: build
        run: |
          bash scripts/build-one-plugin-zip.sh biopentra-storefront
          zip="builds/zips/biopentra-storefront-${{ steps.meta.outputs.version }}.zip"
          [ -s "$zip" ] || { echo "::error::missing $zip"; ls -la builds/zips || true; exit 1; }
          echo "path=$zip" >> "$GITHUB_OUTPUT"

      - name: Upload to update server
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ secrets.WPUS_TOKEN }}" \
            -F "package=@${{ steps.build.outputs.path }}" \
            "${{ secrets.WPUS_URL }}?slug=${{ steps.meta.outputs.slug }}"

      - name: Verify it is live
        env:
          WPUS_URL: ${{ secrets.WPUS_URL }}
          SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          base="${WPUS_URL%/push.php}"
          curl -sS "$base/?action=get_metadata&slug=$SLUG" | tee /dev/stderr | grep -q '"version"'
